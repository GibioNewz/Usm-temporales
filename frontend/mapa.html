  <script>
    //datos de temperatura manuales para demostrar colores, estas temperaturas deberían ser las que recibimos del punto de monitoreo
    const datos = {
      edificioA:   { nombre: "Edificio A",   temp: 22.0 },
      patio:       { nombre: "Patio Central",temp: 25.3 },
      ciac:        { nombre: "CIAC",         temp: 18.7 },
      edificioB:   { nombre: "Edificio B",   temp: 30.1 },
      edificioE:   { nombre: "Edificio E",   temp: 20.5 },
      Fbiblioteca: { nombre: "Biblioteca",   temp: 28.2 },
      testamento:  { nombre: "Testamento",   temp: 24.0 },
      Fcasino:     { nombre: "Casino",       temp: 26.4 },
      edificioC:   { nombre: "Edificio C",   temp: 21.8 },
      edificioL:   { nombre: "Edificio L",   temp: 19.6 },
      edificioK:   { nombre: "Edificio K",   temp: 23.5 }
    };

    function colorSegunTemp(t) {
    if      (t >= 30) return '#D73027';  //rojo
    else if (t >= 25) return '#FC8D59';  //naranja
    else if (t >= 20) return '#FFFFBF';  //amarillo
    else if (t >= 15) return '#91BFDB';  //azul
    else               return '#4575B4';  //azul hielo
    }


    Object.keys(datos).forEach(id => {
      const zona = document.getElementById(id);
      if (!zona) return console.warn(`No existe <path id="${id}">`);
      const info = datos[id];
      zona.style.fill = colorSegunTemp(info.temp);
      zona.addEventListener('click', () => {
        alert(`${info.nombre}\nTemperatura: ${info.temp.toFixed(1)} °C`);
      });
    });
  </script>
